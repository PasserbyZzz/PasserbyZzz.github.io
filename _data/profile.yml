short_bio: >-
  <p>
    Hi! I'm Kaiyang Xu (<span style="display: inline-block;">徐恺阳</span>), an undergraduate student at Shanghai Jiao Tong University, majoring in
    Automation (IEEE Honor Class). I expect to graduate in June 2027, and will start my Ph.D. in
    Computer Science and Technology at Shanghai Jiao Tong University and Shanghai Innovation Institute in September 2027.
    My current GPA is 3.97/4.30 (91.67/100), and I rank 1st out of 33 in my major.
  </p>
  <p>
    I work on robot learning in the RL2 Lab at Shanghai Jiao Tong University, advised by
    <a href="https://gaoyue.sjtu.edu.cn/" target="_blank">Prof. Yue Gao</a>.
  </p>
  <p>
    My research interests lie in robot learning and reinforcement learning, especially humanoid locomotion
    and whole-body control.
  </p>
  <p>
    I welcome discussions and potential collaborations related to my research interests.
  </p>

